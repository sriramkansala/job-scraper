# Single source of truth for Sriram's resume. Rebuild with ./resume/build.sh
# RenderCV v2.8 schema: https://docs.rendercv.com
#
# Facts come only from profile/designer-profile.md, profile/01-profile-and-icp.md
# and his previous resume. Do not add anything that is not in those sources.
#
# Layout notes (ATS):
# - Single column. Company, title, dates and location sit on one line, so text
#   extraction keeps them together and in reading order.
# - Year-only dates are written as bare integers (2014, not "2014"). A quoted
#   year is parsed as a date and rendered as "Jan 2014", which invents a month.
cv:
  name: Damotharan Sriram
  location: Bengaluru, Karnataka, India
  email: sriram.kansala@gmail.com
  phone: "+91 97816 98929"
  website: https://sriramkansala.framer.ai/
  social_networks:
    - network: LinkedIn
      username: sriram-kansala-330203113
  sections:
    summary:
      - "Designer with 5+ years across fintech, enterprise SaaS and consumer products. Specialises in design systems, data-heavy workflows and accessible (WCAG AA) interfaces, and designs and builds products independently (Notate, Artos)."

    experience:
      - company: Turinglabs
        # TITLE: confirm with Sriram (LinkedIn: Product Designer; old resume: Senior Product Designer)
        position: Product Designer
        start_date: 2023-02
        end_date: present
        location: Karnataka, India
        highlights:
          - Redesigned the core DCF (discounted cash flow) flow into a guided experience for private-equity workflows.
          - Designed the Equity Simulation feature, letting investors stress-test scenarios before making investment decisions.
          - "Rebuilt the design token architecture as a three-tier semantic model: 157 component tokens reduced to 63 semantic tokens, cutting the token payload 73% (137KB to 37KB)."
          - Cut client theming time from 2–3 days to under an hour, with WCAG AA contrast validated at token definition.

      # LinkedIn shows Aug 2021 – May 2023 for L&T (overlaps Turinglabs). These are the old resume's dates.
      # "(LTIMindtree)" is left out: the font kerns "LT" so that text extraction reads "L TIMindtree".
      - company: Larsen & Toubro Infotech
        position: UX / Product Designer
        start_date: 2021-08
        end_date: 2022-12
        location: Karnataka, India
        highlights:
          - Redesigned enterprise analytics dashboards and internal tools for manufacturing and infrastructure clients.
          - Rebuilt data-heavy reporting interfaces to surface critical information faster.
          - Standardised UI patterns across modules and authored shared component specifications.

      # LinkedIn shows Sep 2019 – Sep 2020 for Camberry (portfolio site says 2019 – 2021). These are the old resume's dates.
      - company: Camberry Studio
        position: Motion Designer
        start_date: 2019-08
        end_date: 2020-07
        location: Karnataka, India
        highlights:
          - Motion design and animation for ed-tech, real estate and consumer product clients.
          - Produced explainer videos and UI animations; established style guides and motion principles.

    projects:
      - name: Notate, Chrome extension
        date: 2026
        highlights:
          - Designed and built with Claude Code; live on the Chrome Web Store at v1.1.3.
          - Element and region capture, screen recording and 60-second DOM replay, with push to Jira, Linear, GitLab and Trello.
      - name: Artos, personal finance app (independent)
        start_date: 2019
        end_date: present
        highlights:
          - Led end-to-end design in partnership with a developer for an Android investment and expense tracker (10k+ downloads, 3.6★, ~1,500 DAU).
          - Shipped a full app redesign, ELI5 financial explainers and the core user flows.
          - The redesign initially caused a 30% user drop-off; diagnosed the causes through research and analytics, and now iterating on fixes.

    skills:
      - label: Product design
        details: UX, UI, interaction design, information architecture, wireframing, prototyping, user research, usability testing, accessibility (WCAG AA), responsive design
      - label: Design systems
        details: Component libraries, design tokens, semantic token architecture, theming, style guides, pattern libraries, cross-platform consistency
      - label: Domains
        details: Fintech, private equity, financial modelling (DCF, equity simulation), enterprise SaaS, analytics dashboards, consumer mobile apps
      - label: Tools
        details: Figma, Framer, ProtoPie, Rive, Sketch, InVision, Zeplin, Adobe Photoshop, Illustrator, After Effects, Claude Code
      - label: Other
        details: Motion design, animation, stakeholder communication, cross-functional collaboration, Agile/Scrum
      - label: Languages
        details: Telugu (native), Tamil, Hindi, English

    education:
      - institution: Lovely Professional University
        area: Mechanical Engineering (Honors)
        degree: Bachelor of Technology,
        start_date: 2014
        end_date: 2018
        location: Punjab, India
      - institution: Sri Chaitanya Junior College
        area: Higher Secondary (Math, Physics, Chemistry)
        start_date: 2012
        end_date: 2014
        location: Andhra Pradesh, India

design:
  theme: classic
  page:
    size: a4
    top_margin: 0.45in
    bottom_margin: 0.45in
    left_margin: 0.55in
    right_margin: 0.55in
    show_footer: false
    show_top_note: false
  typography:
    alignment: left
    line_spacing: 0.5em
    font_size:
      body: 10pt
      name: 22pt
      section_titles: 1.25em
  header:
    space_below_name: 0.3cm
    space_below_headline: 0cm
    space_below_connections: 0.2cm
    connections:
      phone_number_format: international
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: "|"
      space_between_connections: 0.25cm
  section_titles:
    type: with_full_line
    space_above: 0.3cm
    space_below: 0.15cm
  sections:
    space_between_regular_entries: 0.6em
    show_time_spans_in: []
  entries:
    date_and_location_width: 0cm
    space_between_columns: 0cm
    side_space: 0cm
    degree_width: 0cm
  templates:
    experience_entry:
      main_column: |-
        **COMPANY** | POSITION | DATE | LOCATION
        HIGHLIGHTS
      date_and_location_column: ""
    normal_entry:
      main_column: |-
        **NAME** | DATE
        HIGHLIGHTS
      date_and_location_column: ""
    education_entry:
      main_column: "**INSTITUTION** | DEGREE AREA | DATE | LOCATION"
      degree_column: null
      date_and_location_column: ""

locale:
  language: english
  present: Present
  # Standard three-letter months so ATS date parsers read every date as "Mon YYYY".
  month_abbreviations: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]

settings:
  current_date: today
  pdf_title: Damotharan Sriram - Resume
  render_command:
    output_folder: rendercv_output
    pdf_path: Damotharan-Sriram-Product-Designer.pdf
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_png: true
