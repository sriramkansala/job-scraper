function lvlClass(l){return l==='Senior'?'senior':l==='Lead+'?'lead':''}
function regClass(r){return r==='India'?'india':r==='Worldwide'?'worldwide':''}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const rg=document.getElementById('region').value;
  const lv=document.getElementById('level').value;
  const src=document.getElementById('source').value;
  const f=J.filter(j=>
    (!q||(j.title+' '+j.company).toLowerCase().includes(q))&&
    (!rg||j.region===rg)&&(!lv||j.level===lv)&&(!src||j.source===src));
  document.getElementById('count').textContent=f.length+' roles';
  document.getElementById('grid').innerHTML=f.map(j=>`
    <div class="card">
      <div>
        <div class="title">${j.title}</div>
        <div class="meta-row">
          <span class="tag">${j.source}</span>
          <span class="tag ${regClass(j.region)}">${j.region}</span>
          <span class="tag ${lvlClass(j.level)}">${j.level}</span>
          <span>${j.company||''}</span>
          <span>${j.location||''}</span>
          <span>${j.date||''}</span>
        </div>
      </div>
      <a class="apply" href="${j.url}" target="_blank">Apply →</a>
    </div>`).join('');
}
['q','region','level','source'].forEach(id=>document.getElementById(id).addEventListener('input',render));
render();
</script>
